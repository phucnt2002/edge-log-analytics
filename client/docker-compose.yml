version: '3.8'

services:
  # Edge Gateway 1
  edge-node-1:
    build: .
    container_name: edge-gateway-01
    environment:
      - NODE_ID=edge-gateway-01
    ports:
      - "8001:8000"
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 512M
    restart: unless-stopped

  # Edge Gateway 2
  edge-node-2:
    build: .
    container_name: edge-gateway-02
    environment:
      - NODE_ID=edge-gateway-02
    ports:
      - "8002:8000"
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 512M
    restart: unless-stopped

