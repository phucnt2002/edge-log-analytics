global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "edge_iot_fleet"
    metrics_path: "/metrics"
    static_configs:
      # THAY IP_VM_1_PUBLIC BẰNG ĐỊA CHỈ IP CỦA MÁY CLIENT (VM 1)
      - targets:
          - "10.0.0.232:8001" # Edge Node 01
          - "10.0.0.232:8002" # Edge Node 02
          - "10.0.0.232:8003" # Edge Node 03
          - "10.0.0.232:8004" # Edge Node 04
          - "10.0.0.232:8005" # Edge Node 05
